<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino VPN Setup</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 400px; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .screen { display: none; }
        .active { display: block; }
        .card { border: 1px solid #e0e0e0; padding: 15px; border-radius: 12px; margin: 10px 0; cursor: pointer; text-align: center; }
        .card:hover { border-color: #007bff; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #007bff; color: white; cursor: pointer; margin-top: 10px; }
        .back-btn { background: #e0e0e0; color: #333; }
        h2 { text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-home" class="screen active">
        <h2>Выберите устройство</h2>
        <div class="card" onclick="showScreen('screen-ios')">iPhone/iPad</div>
        <div class="card" onclick="showScreen('screen-android')">Android</div>
        <button onclick="showScreen('screen-extra')">Подключить доп. устройство</button>
    </div>

    <div id="screen-ios" class="screen">
        <h2>Шаг 1: Установка</h2>
        <p>Скачайте приложение для iPhone/iPad</p>
        <button class="back-btn" onclick="showScreen('screen-home')">Назад</button>
    </div>

    <div id="screen-extra" class="screen">
        <h2>Подключить устройство</h2>
        <p>Отсканируйте QR-код:</p>
        <div style="text-align:center; padding:20px; border:1px dashed #ccc;">[QR CODE HERE]</div>
        <button class="back-btn" onclick="showScreen('screen-home')">Назад</button>
    </div>
</div>

<script>
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }
</script>

</body>
</html>

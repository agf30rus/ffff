<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino VPN</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <div id="screen-1" class="screen active">
            <h1>Выберите устройство</h1>
            <p class="subtitle">Выберите ваше устройство для настройки подключения</p>
            
            <div class="grid">
                <button class="card-btn">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                    <span>iPhone/iPad</span>
                </button>
                <button class="card-btn">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    <span>Android</span>
                </button>
                <button class="card-btn">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M12 2v20"/><path d="M4.2 4.2l15.6 15.6"/><path d="M4.2 19.8l15.6-15.6"/></svg>
                    <span>Windows</span>
                </button>
                <button class="card-btn">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.94c1.5 0 2.75-1.06 4-1.06 3 0 6 8 6 8s-1.5-2-2-3c-1-2-6-3-6-3s-5 1-6 3c-.5 1-2 3-2 3s3-8 6-8c1.25 0 2.5 1.06 4 1.06Z"/><path d="M10 2c-1 5 1 10 1 10"/></svg>
                    <span>macOS</span>
                </button>
            </div>

            <button class="card-btn full-width">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                <span>Android TV / Apple TV</span>
            </button>
            
            <button class="extra-btn">➕ Подключить дополнительное устройство</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

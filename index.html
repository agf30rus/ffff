<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN & City Cam Bot</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <header>
        <span id="app-title">Панель Управления</span>
        <select id="lang-switcher" onchange="changeLanguage(this.value)">
            <option value="ru">RU</option>
            <option value="en">EN</option>
        </select>
    </header>

    <section id="tab-vpn" class="tab-content active">
        <div class="card">
            <h3 id="txt-vpn-status">Статус подписки: Активна</h3>
            <p id="txt-vpn-expires">Действует до: 25.12.2026</p>
            <button class="btn" onclick="actionBuy()" id="btn-buy">Продлить VPN</button>
        </div>
    </section>

    <section id="tab-cams" class="tab-content">
        <h3 id="txt-cams-title" style="margin-left: 15px;">Мониторинг дорог (Астрахань)</h3>
        
        <div class="cam-selector">
            <label for="cam-select" id="txt-select-cam">Выберите улицу:</label>
            <select id="cam-select" onchange="playCamera(this.value)">
                <option value="">-- Выберите из списка --</option>
                <option value="https://пример-сервера.su/live/cam1.m3u8">ул. Кирова / ул. Н. Островского</option>
                <option value="https://пример-сервера.su/live/cam2.m3u8">Новый Мост (Въезд)</option>
                <option value="https://пример-сервера.su/live/cam3.m3u8">ул. Адмиралтейская</option>
            </select>
        </div>

        <div class="video-container">
            <video id="video-player" controls autoplay muted playsinline></video>
        </div>
    </section>

    <section id="tab-support" class="tab-content">
        <div class="card text-center">
            <h3 id="txt-help-title">Нужна помощь?</h3>
            <p id="txt-help-desc">Если у вас возникли проблемы с подключением или вы хотите сообщить о ДПС, напишите нашему оператору.</p>
            <a href="https://t.me/твой_логин_поддержки" class="btn btn-link" id="btn-support">Связаться с техподдержкой</a>
        </div>
    </section>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('tab-vpn', this)" id="nav-vpn">VPN</button>
        <button class="nav-item" onclick="switchTab('tab-cams', this)" id="nav-cams">Камеры</button>
        <button class="nav-item" onclick="switchTab('tab-support', this)" id="nav-support">Поддержка</button>
    </nav>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Выберите устройство</title>
    <!-- Подключаем иконки Lucide для точного повторения интерфейса -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f141c; /* Глубокий темный фон */
            /* Эффект легкого фонового паттерна в стиле Telegram (обои) */
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0), 
                              radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 0);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* Если захочешь свои обои, просто раскомментируй строки ниже и вставь ссылку: */
        /* 
        body {
            background: url('ССЫЛКА_НА_КАРТИНКУ') no-repeat center center fixed;
            background-size: cover;
        } 
        */

        .container {
            background-color: #18222d; /* Цвет карточки (темный) */
            width: 100%;
            max-width: 400px;
            border-radius: 28px;
            padding: 32px 24px 24px 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #7e8b98;
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 28px;
        }

        /* Сетка для 4-х основных устройств */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card {
            background-color: transparent;
            border: 1px solid #24313f;
            border-radius: 18px;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .card:active {
            background-color: #202b36;
            transform: scale(0.98);
        }

        .icon-wrapper {
            width: 42px;
            height: 42px;
            background-color: rgba(36, 179, 114, 0.1); /* Прозрачно-зеленый бокс */
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            color: #24b372; /* Фирменный зеленый цвет иконок */
        }

        .card-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
        }

        /* Длинная кнопка для Android TV / Apple TV */
        .full-card {
            border: 1px solid #24313f;
            border-radius: 18px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            margin-bottom: 28px;
            transition: background-color 0.2s;
        }

        .full-card:active {
            background-color: #202b36;
        }

        .full-card .card-title {
            font-size: 15px;
        }

        /* Разделительная линия */
        .divider {
            height: 1px;
            background-color: #24313f;
            margin-bottom: 24px;
        }

        /* Нижняя синяя кнопка подключения дополнительного устройства */
        .action-button {
            background-color: rgba(82, 142, 219, 0.1); /* Прозрачно-синий фон */
            border: 1px solid rgba(82, 142, 219, 0.3);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #528edb; /* Красивый синий Telegram-цвет */
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.3;
            transition: background-color 0.2s;
        }

        .action-button:active {
            background-color: rgba(82, 142, 219, 0.2);
        }

        .action-button i {
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Выберите устройство</h1>
        <p class="subtitle">Выберите ваше устройство для<br>настройки подключения</p>

        <!-- Сетка 2х2 -->
        <div class="grid">
            <div class="card">
                <div class="icon-wrapper">
                    <i data-lucide="smartphone"></i>
                </div>
                <span class="card-title">iPhone/iPad</span>
            </div>

            <div class="card">
                <div class="icon-wrapper">
                    <i data-lucide="smartphone-charging"></i>
                </div>
                <span class="card-title">Android</span>
            </div>

            <div class="card">
                <div class="icon-wrapper">
                    <i data-lucide="monitor"></i>
                </div>
                <span class="card-title">Windows</span>
            </div>

            <div class="card">
                <div class="icon-wrapper">
                    <i data-lucide="laptop"></i>
                </div>
                <span class="card-title">macOS</span>
            </div>
        </div>

        <!-- Широкая плашка ТВ -->
        <div class="full-card">
            <div class="icon-wrapper">
                <i data-lucide="tv"></i>
            </div>
            <span class="card-title">Android TV / Apple TV</span>
        </div>

        <div class="divider"></div>

        <!-- Нижняя синяя кнопка -->
        <div class="action-button">
            <i data-lucide="copy" size="18"></i>
            <span>Подключить дополнительное<br>устройство</span>
        </div>
    </div>

    <script>
        // Инициализируем иконки Lucide, чтобы они отрендерились
        lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino VPN</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <div id="screen-1" class="screen active">
            <h1>Выберите устройство</h1>
            <p class="subtitle">Выберите ваше устройство для настройки подключения</p>
            <div class="grid">
                <button class="card-btn" onclick="showScreen(2)">📱<br>iPhone/iPad</button>
                <button class="card-btn" onclick="showScreen(2)">🤖<br>Android</button>
                <button class="card-btn" onclick="showScreen(2)">💻<br>Windows</button>
                <button class="card-btn" onclick="showScreen(2)">🍎<br>macOS</button>
            </div>
            <button class="card-btn full-width" onclick="showScreen(2)">📺 Android TV / Apple TV</button>
            <button class="extra-btn">➕ Подключить дополнительное устройство</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino VPN Web App</title>
    <!-- Подключаем Telegram Web Apps SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS и FontAwesome для иконок -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            -webkit-font-smoothing: antialiased;
        }
        .bg-dino-green {
            background-color: #0b9363;
        }
        .bg-dino-green:hover {
            background-color: #097d54;
        }
        .text-dino-green {
            color: #0b9363;
        }
    </style>
</head>
<body class="p-4 min-h-screen flex flex-col justify-between selection:bg-emerald-100">

    <!-- Главный контейнер -->
    <div class="w-full max-w-md mx-auto flex-1 flex flex-col justify-between min-h-[88vh]">
        
        <!-- ================= ЭКРАН 1: ВЫБОР УСТРОЙСТВА ================= -->
        <div id="screen-1" class="flex-1 flex flex-col justify-between">
            <div>
                <h2 class="text-[28px] font-bold text-center text-gray-900 dark:text-white tracking-tight mb-2 mt-6">
                    Выберите устройство
                </h2>
                <p class="text-gray-400 dark:text-zinc-400 text-center text-[15px] px-8 leading-relaxed mb-8">
                    Выберите ваше устройство для настройки подключения
                </p>

                <!-- Сетка устройств 2х2 -->
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div onclick="switchScreen(2)" class="border border-gray-100 dark:border-zinc-800 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer bg-white dark:bg-zinc-900/50 shadow-sm hover:shadow-md transition active:scale-95">
                        <div class="w-12 h-12 bg-emerald-50 dark:bg-emerald-950/30 rounded-2xl flex items-center justify-center text-emerald-600 text-xl mb-3">
                            <i class="fa-solid fa-mobile-screen-button"></i>
                        </div>
                        <span class="font-semibold text-gray-800 dark:text-zinc-200 text-sm">iPhone/iPad</span>
                    </div>

                    <div class="border border-gray-100 dark:border-zinc-800 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer bg-white dark:bg-zinc-900/50 shadow-sm hover:shadow-md transition active:scale-95">
                        <div class="w-12 h-12 bg-emerald-50 dark:bg-emerald-950/30 rounded-2xl flex items-center justify-center text-emerald-600 text-xl mb-3">
                            <i class="fa-brands fa-android"></i>
                        </div>
                        <span class="font-semibold text-gray-800 dark:text-zinc-200 text-sm">Android</span>
                    </div>

                    <div class="border border-gray-100 dark:border-zinc-800 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer bg-white dark:bg-zinc-900/50 shadow-sm hover:shadow-md transition active:scale-95">
                        <div class="w-12 h-12 bg-emerald-50 dark:bg-emerald-950/30 rounded-2xl flex items-center justify-center text-emerald-600 text-xl mb-3">
                            <i class="fa-solid fa-desktop"></i>
                        </div>
                        <span class="font-semibold text-gray-800 dark:text-zinc-200 text-sm">Windows</span>
                    </div>

                    <div class="border border-gray-100 dark:border-zinc-800 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer bg-white dark:bg-zinc-900/50 shadow-sm hover:shadow-md transition active:scale-95">
                        <div class="w-12 h-12 bg-emerald-50 dark:bg-emerald-950/30 rounded-2xl flex items-center justify-center text-emerald-600 text-xl mb-3">
                            <i class="fa-brands fa-apple"></i>
                        </div>
                        <span class="font-semibold text-gray-800 dark:text-zinc-200 text-sm">macOS</span>
                    </div>
                </div>

                <div class="border border-gray-100 dark:border-zinc-800 rounded-2xl p-4 flex items-center justify-center space-x-3 mb-6 bg-white dark:bg-zinc-900/50 shadow-sm cursor-pointer hover:bg-gray-50 dark:hover:bg-zinc-900 transition">
                    <div class="w-10 h-10 bg-emerald-50 dark:bg-emerald-950/30 rounded-xl flex items-center justify-center text-emerald-600 text-lg">
                        <i class="fa-solid fa-tv"></i>
                    </div>
                    <span class="font-semibold text-gray-800 dark:text-zinc-200 text-sm">Android TV / Apple TV</span>
                </div>
            </div>

            <button class="w-full border border-sky-200 dark:border-sky-900/50 bg-sky-50/60 dark:bg-sky-950/20 text-sky-600 dark:text-sky-400 font-semibold py-4 rounded-2xl text-sm transition active:scale-[0.99]">
                <i class="fa-regular fa-copy mr-2"></i> Подключить дополнительное устройство
            </button>
        </div>


        <!-- ================= ЭКРАН 2: УСТАНОВКА ПРИЛОЖЕНИЯ ================= -->
        <div id="screen-2" class="flex-1 flex flex-col justify-between hidden">
            <div>
                <!-- ОБНОВЛЕННАЯ НАВИГАЦИОННАЯ ПАНЕЛЬ С КНОПКОЙ ПОДДЕРЖКИ -->
                <div class="flex justify-between items-center mb-6 mt-2">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-emerald-700 rounded-full flex items-center justify-center text-white">
                            <i class="fa-solid fa-dragon text-sm"></i>
                        </div>
                        <span class="font-bold text-gray-800 dark:text-zinc-100 text-base">Dino VPN</span>
                    </div>
                    
                    <!-- Блок кнопок справа -->
                    <div class="flex items-center space-x-2">
                        <!-- Кнопка Поддержка (Новая!) -->
                        <button onclick="openSupport()" class="border border-emerald-200 dark:border-emerald-900/50 bg-emerald-50/50 dark:bg-emerald-950/20 rounded-full px-3 py-1.5 text-xs font-bold text-emerald-600 dark:text-emerald-400 flex items-center space-x-1.5 shadow-sm active:scale-95 transition">
                            <i class="fa-solid fa-headset text-[11px]"></i>
                            <span>Поддержка</span>
                        </button>
                        
                        <!-- Кнопка Инструкция -->
                        <button class="border border-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 rounded-full px-3 py-1.5 text-xs font-semibold text-sky-600 dark:text-sky-400 flex items-center space-x-1 shadow-sm">
                            <span class="text-red-500 font-extrabold">?</span> <span>Инструкция</span>
                        </button>
                    </div>
                </div>

                <h2 class="text-[26px] font-bold text-gray-900 dark:text-white tracking-tight leading-tight mb-2">
                    Шаг 1. Установка приложения
                </h2>
                <p class="text-gray-400 dark:text-zinc-400 text-[15px] mb-6">
                    Выберите приложение для iPhone/iPad и скачайте его.
                </p>

                <!-- Вкладки Happ / INCY -->
                <div class="bg-gray-100 dark:bg-zinc-900 p-1 rounded-full flex mb-4 border border-gray-200/50 dark:border-zinc-800">
                    <button class="flex-1 bg-emerald-200 dark:bg-emerald-900 text-gray-900 dark:text-emerald-100 font-bold py-2.5 rounded-full text-xs flex items-center justify-center space-x-1 shadow-sm">
                        <span>Happ</span> <i class="fa-solid fa-star text-[10px]"></i>
                    </button>
                    <button class="flex-1 text-gray-400 dark:text-zinc-500 font-bold py-2.5 rounded-full text-xs">
                        INCY
                    </button>
                </div>

                <!-- Кнопка "В чем разница?" -->
                <div class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-2xl py-3 px-4 flex items-center justify-center space-x-2 mb-6 shadow-sm">
                    <span class="bg-blue-500 text-white text-[10px] w-4 h-4 rounded-md flex items-center justify-center font-bold">i</span>
                    <span class="text-gray-600 dark:text-zinc-400 text-xs font-semibold">В чем разница приложений?</span>
                </div>

                <!-- Кнопки скачивания -->
                <div class="space-y-3">
                    <button class="w-full bg-dino-green text-white p-4 rounded-2xl flex items-center text-left shadow-md shadow-emerald-900/10 transition active:scale-[0.99]">
                        <div class="bg-white/20 w-11 h-11 rounded-xl flex items-center justify-center text-xl mr-4">
                            <i class="fa-solid fa-download"></i>
                        </div>
                        <div>
                            <div class="font-bold text-[16px]">App Store (регион Россия)</div>
                            <div class="text-xs text-emerald-100/70 mt-0.5">Happ для Apple ID Россия</div>
                        </div>
                    </button>

                    <button class="w-full bg-dino-green text-white p-4 rounded-2xl flex items-center text-left shadow-md shadow-emerald-900/10 transition active:scale-[0.99]">
                        <div class="bg-white/20 w-11 h-11 rounded-xl flex items-center justify-center text-xl mr-4">
                            <i class="fa-solid fa-download"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-[16px]">App Store (другой регион)</div>
                            <div class="text-xs text-emerald-100/70 mt-0.5">Из магазина</div>
                        </div>
                    </button>
                </div>

                <p class="text-center text-xs text-gray-400 dark:text-zinc-500 mt-6 leading-normal">
                    Установили приложение? <span class="text-dino-green font-bold">Нажмите «Я установил Happ»</span>
                </p>
            </div>

            <!-- Нижний тулбар -->
            <div class="flex items-center space-x-3 mt-8">
                <button class="border border-gray-200 dark:border-zinc-700 text-gray-400 dark:text-zinc-500 p-4 rounded-xl bg-white dark:bg-zinc-900 shadow-sm active:scale-95 transition">
                    <i class="fa-solid fa-qrcode text-lg"></i>
                </button>
                <button onclick="switchScreen(1)" class="flex-1 border border-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-gray-700 dark:text-zinc-300 font-bold py-3.5 rounded-xl text-sm transition shadow-sm active:scale-95">
                    Назад
                </button>
                <button onclick="closeTelegramApp()" class="flex-[1.6] bg-dino-green text-white font-bold py-3.5 rounded-xl text-sm transition shadow-md active:scale-95">
                    Я установил Happ
                </button>
            </div>
        </div>

    </div>

    <script>
        const webApp = window.Telegram.WebApp;
        webApp.ready();
        webApp.expand();

        function switchScreen(screenNumber) {
            const screen1 = document.getElementById('screen-1');
            const screen2 = document.getElementById('screen-2');
            
            if (screenNumber === 1) {
                screen1.classList.remove('hidden');
                screen2.classList.add('hidden');
            } else {
                screen1.classList.add('hidden');
                screen2.classList.remove('hidden');
            }
        }

        function closeTelegramApp() {
            webApp.close();
        }

        // Функция открытия поддержки внутри Telegram (Новая!)
        function openSupport() {
            // Замени 'твой_аккаунт_поддержки' на юзернейм админа или бота саппорта
            const supportUsername = 'твой_аккаунт_поддержки'; 
            
            // Используем официальный метод Telegram SDK для безопасного открытия ссылок внутри приложения
            webApp.openTelegramLink('https://t.me/' + supportUsername);
        }
    </script>
</body>
</html>

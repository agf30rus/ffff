<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>vlessX VPN</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* ... (Ваши оригинальные стили остаются здесь) ... */
        /* Добавляем стили для новых кнопок в стиле вашего дизайна */
        .activate-btn {
            background-color: #00a86b;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            text-align: center;
        }
        .error-btn {
            background-color: transparent;
            border: 1px solid #ff453a;
            color: #ff453a;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="screen-activation" class="screen">
            <h1 style="margin-top: 10px;">Шаг 2. Активация</h1>
            <p class="subtitle">Нажмите кнопку ниже, чтобы<br>активировать VPN.</p>
            
            <a href="ВАША_ССЫЛКА_АКТИВАЦИИ" class="activate-btn">Активировать VPN</a>
            
            <p style="color: #8593a6; font-size: 13px; text-align: center; margin-bottom: 24px;">
                После активации выберите нужную страну в приложении
            </p>

            <button class="error-btn" onclick="showDevelopmentMessage()">
                <i data-lucide="help-circle" style="vertical-align: middle; margin-right: 8px;" size="16"></i>
                VPN не работает
            </button>
            
            <button class="text-btn" style="width: 100%;" onclick="closeInstruction()">Назад</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        // ... (Ваши функции остаются без изменений)
        function showActivation() {
            document.getElementById('screen-instruction').classList.remove('active');
            document.getElementById('screen-activation').classList.add('active');
        }
    </script>
</body>
</html>

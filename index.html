<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino VPN</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div id="app">
        <div id="screen-1" class="screen active">
            <h1>Выберите устройство</h1>
            <p class="subtitle">Выберите ваше устройство для настройки подключения</p>
            <div class="grid">
                <button class="device-btn">iPhone/iPad</button>
                <button class="device-btn">Android</button>
                <button class="device-btn">Windows</button>
                <button class="device-btn">macOS</button>
            </div>
            <button class="device-btn full-width">Android TV / Apple TV</button>
        </div>

        <div id="screen-2" class="screen">
            <h1>Шаг 1. Установка</h1>
            <p class="subtitle">Выберите приложение для iPhone/iPad и скачайте его.</p>
            <button class="main-btn" onclick="showScreen(3)">Я установил Happ</button>
            <button class="back-btn" onclick="showScreen(1)">Назад</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

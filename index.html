<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Выберите устройство</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000; /* Прям чёрный-чёрный фон */
            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* Если в будущем решишь наложить поверх черного фона полупрозрачные обои, 
           раскомментируй этот блок и вставь ссылку на паттерн/картинку: */
        /* body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('ССЫЛКА_НА_КАРТИНКУ') repeat;
            opacity: 0.05; /* Едва заметный паттерн поверх черноты */
            z-index: -1;
        }
        */

        .container {
            background-color: #1c1c1e; /* Плотный темный цвет карточки, как в iOS/Telegram на черном фоне */
            width: 100%;
            max-width: 400px;
            border-radius: 28px;
            padding: 32px 24px 24px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #2c2c2e; /* Аккуратная граница карточки */
        }

        h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8e8e93;
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 28px;
        }

        /* Сетка для 4-х основных устройств */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card {
            background-color: transparent;
            border: 1px solid #2c2c2e;
            border-radius: 18px;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .card:active {
            background-color: #2c2c2e;
            transform: scale(0.98);
        }

        .icon-wrapper {
            width: 42px;
            height: 42px;
            background-color: rgba(48, 209, 88, 0.1); /* Прозрачно-зеленый бокс (iOS Dark Green) */
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            color: #30d158; /* Яркий зеленый для темной темы */
        }

        .card-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
        }

        /* Длинная кнопка для Android TV / Apple TV */
        .full-card {
            background-color: transparent;
            border: 1px solid #2c2c2e;
            border-radius: 18px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            margin-bottom: 28px;
            transition: background-color 0.2s;
        }

        .full-card:active {
            background-color: #2c2c2e;
        }

        .full-card .card-title {
            font-size: 15px;
        }

        /* Разделительная линия */
        .divider {
            height: 1px;
            background-color: #2c2c2e;
            margin-bottom: 24px;
        }

        /* Нижняя синяя кнопка подключения дополнительного устройства */
        .action-button {
            background-color: rgba(10, 132, 255, 0.1); /* Прозрачно-синий фон (iOS Dark Blue) */
            border: 1px solid rgba(10, 132, 255, 0.25);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #0a84ff; /* Насыщенный синий Telegram/iOS цвет */
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            line-height: 1.3;
            transition: background-color 0.2s;
        }

        .action-button:active {
            background-color: rgba(10, 132, 255, 0.2);
        }

        .action-button i {
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Выберите устройство</h1>
        <p class="subtitle">Выберите ваше устройство для<br>настройки подключения</p>

        <div class="grid">
            <div class="card">
                <div class="icon-wrapper">
                    <i data-lucide="smartphone"></i>
                </div>
                <span class="card-title">iPhone/iPad</span>
            </div>

            <div class="card">
                <div class="icon-wrapper">
                    <i data-lucide="smartphone-charging"></i>
                </div>
                <span class="card-title">Android</span>
            </div>

            <div class="card">
                <div class="icon-wrapper">
                    <i data-lucide="monitor"></i>
                </div>
                <span class="card-title">Windows</span>
            </div>

            <div class="card">
                <div class="icon-wrapper">
                    <i data-lucide="laptop"></i>
                </div>
                <span class="card-title">macOS</span>
            </div>
        </div>

        <div class="full-card">
            <div class="icon-wrapper">
                <i data-lucide="tv"></i>
            </div>
            <span class="card-title">Android TV / Apple TV</span>
        </div>

        <div class="divider"></div>

        <div class="action-button">
            <i data-lucide="copy" size="18"></i>
            <span>Подключить дополнительное<br>устройство</span>
        </div>
    </div>

    <script>
        // Рендерим иконки
        lucide.createIcons();
    </script>
</body>
</html>
